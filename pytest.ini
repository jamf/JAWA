[pytest]
testpaths = tests

# One environmental warning, silenced narrowly. requests 2.31 declares
# supported urllib3/chardet ranges and warns at IMPORT time when the
# installed versions fall outside them; requirements.txt pins requests
# but leaves chardet/urllib3 unpinned, so a fresh venv resolves a chardet
# newer than requests knows about. Nothing in JAWA causes it and nothing
# in JAWA is affected by it.
#
# Matched on the MESSAGE rather than the category on purpose. Naming
# requests.exceptions.RequestsDependencyWarning would make pytest import
# requests to resolve the class -- which is the very import that emits
# the warning -- and it would also swallow any future version-mismatch
# warning, including a real one. This pattern is specific enough that a
# different mismatch still shows up.
#
# Deliberately NOT `error`: promoting every warning to a failure would
# turn an unrelated upstream deprecation into a red build on the next
# dependency bump. The gate is that `pytest -q` reports no warnings.
filterwarnings =
    ignore:urllib3 \(.*\) or chardet \(.*\)/charset_normalizer \(.*\) doesn't match a supported version:Warning
